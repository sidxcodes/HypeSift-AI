[project]
name = "hypesift-backend"
version = "1.0.0"
description = "HypeSift AI — API, job worker and video/AI pipeline"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
